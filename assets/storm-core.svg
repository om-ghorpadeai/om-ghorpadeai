<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#58a6ff"/>
      <stop offset="60%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="20" fill="#0d1117"/>

  <!-- Technical grid -->
  <g opacity="0.12" stroke="#58a6ff">
    <path d="M0 50 H900"/>
    <path d="M0 100 H900"/>
    <path d="M0 150 H900"/>
    <path d="M0 200 H900"/>
    <path d="M0 250 H900"/>

    <path d="M100 0 V300"/>
    <path d="M200 0 V300"/>
    <path d="M300 0 V300"/>
    <path d="M400 0 V300"/>
    <path d="M500 0 V300"/>
    <path d="M600 0 V300"/>
    <path d="M700 0 V300"/>
    <path d="M800 0 V300"/>
  </g>

  <!-- Energy network -->
  <g
    stroke="#58a6ff"
    stroke-width="2"
    fill="none"
    filter="url(#glow)"
    opacity="0.8">

    <path d="M450 150 L300 70 L180 110"/>
    <path d="M450 150 L600 70 L720 110"/>
    <path d="M450 150 L300 230 L180 190"/>
    <path d="M450 150 L600 230 L720 190"/>

  </g>

  <!-- Lightning -->
  <g
    stroke="#ffffff"
    stroke-width="3"
    fill="none"
    filter="url(#glow)">

    <path d="M300 70 L270 115 L290 110 L255 165"/>
    <path d="M600 70 L630 115 L610 110 L645 165"/>

  </g>

  <!-- Central core -->
  <circle
    cx="450"
    cy="150"
    r="65"
    fill="#0d1117"
    stroke="#58a6ff"
    stroke-width="2"
    filter="url(#glow)"
  />

  <circle
    cx="450"
    cy="150"
    r="42"
    fill="url(#core)"
    opacity="0.9"
  />

  <circle
    cx="450"
    cy="150"
    r="15"
    fill="#ffffff"
    filter="url(#glow)"
  />

  <!-- Orbit -->
  <ellipse
    cx="450"
    cy="150"
    rx="95"
    ry="35"
    fill="none"
    stroke="#58a6ff"
    stroke-width="1"
    opacity="0.7"
  />

  <ellipse
    cx="450"
    cy="150"
    rx="35"
    ry="95"
    fill="none"
    stroke="#58a6ff"
    stroke-width="1"
    opacity="0.5"
  />

  <!-- Title -->
  <text
    x="450"
    y="35"
    text-anchor="middle"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="#58a6ff"
    letter-spacing="4">

    OMKAR // ENGINEERING CORE

  </text>

  <!-- Bottom identity -->
  <text
    x="450"
    y="275"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    fill="#8b949e"
    letter-spacing="3">

    AI • MACHINE LEARNING • SYSTEMS • DATA

  </text>

  <!-- System status -->
  <text
    x="35"
    y="275"
    font-family="monospace"
    font-size="11"
    fill="#3fb950">

    ● SYSTEM ONLINE

  </text>

</svg>
